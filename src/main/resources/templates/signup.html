<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>KUchat localhost</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>

<body>
<!--layout/header-->
<h1> KUchat localhost </h1>

<!-- 조건문 (th:if와 th:unless 사용) -->

<div id="user-info">
    <!-- 사용자가 로그인했을 경우 -->
    <div th:if="${id}">
        <p th:text="'id is : ' + ${id}"></p>
        Logged in as: <span th:text="'ID : ' + ${id} + ' 회원이 로그인 된 상태입니다.'"></span>
        <a href="/logout" class="btn btn-info active" role="button">Logout</a>
        <a href="/ws/message" class="btn btn-primary active" role="button">채팅 참여하기</a>
    </div>

    <!-- 사용자가 로그인하지 않았을 경우 -->
    <div th:unless="${id}">
        <a href="/oauth2/authorization/google" class="btn btn-sm btn-success active" role="button">Google Login</a>
    </div>
</div>

<!--layout/footer-->
<script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

</body>
</html>
