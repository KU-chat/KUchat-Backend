<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>KUchat localhost</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
<h3>Enter Member Information</h3>
<div class="col-md-12">
    <div class="col-md-4">
        <form id="signupForm">
            <div class="form-group">
                <label for="setLanguage">Set Language</label>
                <input type="text" class="form-control" id="setLanguage" placeholder="Please enter the site language.">
            </div>

            <div class="form-group">
                <label for="firstLanguage">1st Learning Language</label>
                <input class="form-control" id="firstLanguage"
                       placeholder="Enter the first language you want to learn.">
            </div>

            <div class="form-group">
                <label for="secondLanguage">2nd Learning Language</label>
                <input class="form-control" id="secondLanguage"
                       placeholder="Enter the second language you want to learn.">
            </div>

            <div class="form-group">
                <label for="hometown">Home Town</label>
                <input class="form-control" id="hometown" placeholder="Enter your country of origin.">
            </div>

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" class="form-control" id="name" placeholder="Please enter your name.">
            </div>

            <div class="form-group">
                <label for="birthday">Birthday</label>
                <input type="text" class="form-control" id="birthday"
                       placeholder="Enter your date of birth. (ex. 010323)">
            </div>

            <div class="form-group">
                <label for="department">Department</label>
                <input type="text" class="form-control" id="department" placeholder="Enter your current department.">
            </div>

            <div class="form-group">
                <label for="studentId">Student ID</label>
                <input type="text" class="form-control" id="studentId"
                       placeholder="Enter your student ID. (ex. 202212368)">
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <input type="text" class="form-control" id="gender" placeholder="Enter gender. (Male/Female)">
            </div>

            <button type="submit" class="btn btn-sm btn-success active">Sign Up</button>
            <a th:href="@{/}" role="button" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
<!--layout/footer-->
<script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

<!--index.js 추가-->
<script src="/js/app/index.js"></script>

<script>
    $(document).ready(function () {
        const urlParams = new URLSearchParams(window.location.search);
        const guestToken = urlParams.get('guest-token');

        if (!guestToken) {
            console.error('Guest token not found in URL.');
            return;
        }

        // 폼 제출 시 Ajax 요청 처리
        $('#signupForm').submit(function (event) {
            event.preventDefault(); // 기본 제출 동작 방지

            const formData = {
                setLanguage: $('#setLanguage').val(),
                firstLanguage: $('#firstLanguage').val(),
                secondLanguage: $('#secondLanguage').val(),
                hometown: $('#hometown').val(),
                name: $('#name').val(),
                birthday: $('#birthday').val(),
                department: $('#department').val(),
                studentId: $('#studentId').val(),
                gender: $('#gender').val()
            };

            // 회원가입 요청
            fetch('/member/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': guestToken // guestToken 헤더 추가
                },
                body: JSON.stringify(formData)
            })
                .then(response => {
                    if (response.ok) {
                        return response.json(); // 응답 데이터를 JSON으로 파싱
                    } else {
                        throw new Error(`Signup request failed with status: ${response.status}`);
                    }
                })
                .then(data => {
                    console.log('Signup response:', data);

                    const accessToken = data.accessToken;
                    if (!accessToken) {
                        throw new Error('Access token not found in response.');
                    }

                    console.log('Access Token:', accessToken);

                    // Local Storage에 Access Token 저장
                    localStorage.setItem('accessToken', accessToken);

                    // 홈으로 이동 요청
                    document.cookie = `Authorization=Bearer%20${encodeURIComponent(accessToken)}; path=/; Max-Age=3600`;
                    window.location.href = '/';
                })
                .catch(error => {
                    console.error('Error occurred:', error.message);
                });
        });
    });
</script>
</body>
</html>
