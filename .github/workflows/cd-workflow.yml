name: KUchat CD with Gradle and Docker

on:
  push:
    branches:
      - 'develop'
      - 'main'
  pull_request:
    branches:
      - 'develop'
      - 'main'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: ☕️ set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          setting-path: ${{ github.workspace }}

      - name: 📜 make application-dev.yml
        run: |
          touch ./src/main/resources/application-dev.yml
          echo "${{ secrets.DEV_YML }}" > ./application-dev.yml
        shell: bash

      - name: 👏🏻 grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🐘 build with Gradle (without test)
        run: ./gradlew clean build -x test --stacktrace

      - name: 🐳 Docker build & push
        run:  |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -f Dockerfile-dev -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}

      - name: 🚀 deploy to dev-server with docker compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          port: ${{ secrets.EC2_PORT }}
          envs: GITHUB_SHA
          script: |
            echo "🔍 Searching for docker-compose-dev.yml file"
            COMPOSE_FILE_PATH=$(find . -name "docker-compose-dev.yml" -print -quit)
            
            if [ -z "$COMPOSE_FILE_PATH" ]; then
            echo "❌ docker-compose-dev.yml file not found!"
            exit 1
            fi
            
            COMPOSE_DIR=$(dirname "$COMPOSE_FILE_PATH")
            echo "📂 Found docker-compose-dev.yml in $COMPOSE_DIR, moving to that directory"
            cd "$COMPOSE_DIR"
            
            echo "✋🏻Stopping existing services"
            sudo docker-compose -f docker-compose-dev.yml down
            
            echo "🥳Pulling new images"
            sudo docker-compose -f docker-compose-dev.yml pull
            
            echo "🌱Starting services with new images"
            sudo docker-compose -f docker-compose-dev.yml up -d
      
            echo "🚮Cleaning up old images"
            sudo docker image prune -f